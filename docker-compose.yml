version: '3.8'
services:
  mariadb:
    image: mariadb:11.4
    container_name: gestion_xaranga_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_xaranga
      MYSQL_USER: gestion
      MYSQL_PASSWORD: gestion
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gestion_xaranga_app
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: gestion
      DB_PASSWORD: gestion
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mariadb_data:
